# Model choice: docs/DECISIONS.md #3
default_model: meta-llama/Llama-3.3-70B-Instruct

corpus:
  journal: "PLOS ONE"
  article_type: "research-article"
  min_year: 2010
  max_year: 2026

sampling:
  per_subfield: 2
  seed: 42

# Human-validation pilot + QA thresholds (docs/DECISIONS.md #4, 7/15 meeting).
# The pilot is stratified to guarantee `min_per_subfield` from every psychology
# subfield, then topped up proportionally to `pilot_size` total. The model's
# extraction is scored against the human-coded gold set and must clear each
# threshold (recall/precision/accuracy) per demographic variable and overall.
validation:
  pilot_size: 100
  min_per_subfield: 2
  thresholds:
    recall: 0.90
    precision: 0.90
    accuracy: 0.90
